<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>输电全景管控平台</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar" role="navigation" aria-label="主导航">
    <div class="brand">
      <div class="logo" aria-hidden="true">输</div>
      <div>
        <div class="title">输电全景管控平台</div>
        <div class="subtitle">在线监控 · 全景要图 · 设备管理</div>
      </div>
    </div>

    <div class="nav-tabs" role="tablist" aria-label="主功能导航">
      <button class="active" data-tab="dashboard" role="tab">可视化看板</button>
      <button data-tab="resources" role="tab">资源管理</button>
      <button data-tab="stats" role="tab">查询统计</button>
      <button data-tab="vendors" role="tab">厂商管理</button>
    </div>

    <div style="display:flex;align-items:center;gap:8px">
      <button id="refreshAll" class="nav-action" title="刷新全部" style="background:transparent;border:1px solid rgba(46, 125, 50, 0.2);padding:8px;border-radius:8px;color:var(--muted);cursor:pointer">刷新</button>
    </div>
  </div>

  <div class="main">
    <!-- left -->
    <aside class="panel left-panel" aria-label="设备与上传">
      <h3>设备管理</h3>

      <div class="upload-box" aria-label="图片上传">
        <form id="uploadForm">
          <input id="fileInput" type="file" name="image" accept="image/*" aria-label="上传图片" />
          <div style="height:8px"></div>
          <button type="submit" class="btn small" style="width:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#ffffff; border:none; padding:10px; border-radius:8px; font-weight:700;">上传图片</button>
        </form>
        <div id="uploadResult" style="margin-top:8px;font-size:13px;color:var(--muted)"></div>
      </div>

      <div id="devicesContainer" class="device-list" aria-live="polite">
        <div class="device">
          <div style="width:100%;text-align:center;color:var(--muted)">正在加载设备列表...</div>
        </div>
      </div>
    </aside>

    <!-- center -->
    <main class="panel center" aria-label="主视图">
      <div class="viewer-wrap" id="viewerWrap" role="region" aria-label="图像展示区">
        <div class="viewer-overlay" id="viewerOverlay">-- 时间戳 --</div>
        <div class="viewer-inner" id="viewerInner" aria-live="polite" aria-label="大图展示">
          <div style="color:var(--muted)">大图加载中...</div>
        </div>
        <div class="viewer-watermark">输电全景管控平台</div>

        <div class="arrow left" id="prevBtn" aria-label="上一张">‹</div>
        <div class="arrow right" id="nextBtn" aria-label="下一张">›</div>
      </div>

      <div class="thumb-strip" id="thumbStrip" aria-label="缩略图时间轴">
        <div class="strip-arrow left" id="stripPrev" aria-hidden="true">◂</div>
        <div style="overflow:hidden; flex:1;">
          <div class="thumb-window" id="thumbWindow" aria-hidden="false"></div>
        </div>
        <div class="strip-arrow right" id="stripNext" aria-hidden="true">▸</div>
      </div>
    </main>

    <!-- right -->
    <aside class="panel right-panel" aria-label="操作面板">
      <div>
        <div class="card-title">日期选择</div>
        <div class="date-picker-container" id="datePickerContainer">
          <!-- 日历将通过JavaScript动态生成 -->
        </div>
      </div>

      <div>
        <div class="card-title">操作项</div>
        <div class="ops" role="group" aria-label="操作">
          <button id="grabBtn" class="primary" style="padding:10px 12px;">抓图</button>
          <button id="downloadBtn">下载</button>
          <button id="fullBtn">全屏</button>
          <button id="upgradeBtn">升级</button>
        </div>
      </div>

      <div>
        <div class="card-title">监拍通道</div>
        <div class="channels-container">
          <div class="channels-scroll">
            <div class="channels" id="channelsList" role="tablist" aria-label="通道选择">
              <!-- 通道将通过JavaScript动态生成 -->
            </div>
          </div>
        </div>
      </div>

      <div style="margin-top:auto;font-size:12px;color:#5d8c5f">
        快捷提示：缩略图点击切换主图；双击主图重置缩放；滚轮缩放；放大时可拖动平移。
      </div>
    </aside>
  </div>

  <!-- 升级弹窗 -->
  <div class="modal-overlay" id="upgradeModal">
    <div class="modal">
      <div class="modal-header">
        <span>模型文件升级</span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="modelFile">选择模型文件</label>
          <input type="file" id="modelFile" accept=".bin,.model,.pt,.pth,.onnx,.tflite">
        </div>
        <div class="form-group">
          <label for="targetDevice">目标设备</label>
          <select id="targetDevice">
            <option value="">请选择设备...</option>
            <!-- 设备列表将通过JavaScript动态填充 -->
          </select>
        </div>
        <!-- 新增类型选择-->
        <div class="form-group">
            <label for="modelType">模型类型</label>
            <select id="modelType">
                <option value="11">多曝光融合</option>
                <option value="22">弱光增强</option>
                <option value="33">异物检测</option>
                <option value="44">YOLO检测</option>
                <option value="55">去雾</option>
            </select>
        </div>
        <div class="form-group">
          <label>传输日志</label>
          <div class="log-output" id="upgradeLog">
            <div class="log-entry info">等待上传模型文件...</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelUpgrade" style="background:transparent;border:1px solid rgba(46, 125, 50, 0.3);color:var(--muted);padding:8px 16px;border-radius:6px;cursor:pointer">取消</button>
        <button id="startUpgrade" style="background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer">开始升级</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

<!-- 设备智能助手浮窗 -->
<script src="js/agent_widget.js"></script>
