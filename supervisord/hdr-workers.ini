; HDR Multi-GPU Workers Supervisor Configuration
; Usage:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start all
;   supervisorctl status

[supervisorctl]
serverurl=http://127.0.0.1:9001

[supervisor:logfile]
; Dummy program to redirect logs - actual programs below

; === HDR Fusion Workers ===

[program:hdr-gpu0]
command=python /home/jym/cpp/gw-server/ai-services/multi_gpu_worker.py --port 50055 --gpu-id 0 --model hdr_fusion --max-batch-size 8 --max-wait-ms 10
directory=/home/jym/cpp/gw-server/ai-services
user=jym
autostart=true
autorestart=true
startsecs=15
startretries=3
exitcodes=0
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/hdr-worker-gpu0-stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/hdr-worker-gpu0-stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=CUDA_VISIBLE_DEVICES="0"

[program:hdr-gpu1]
command=python /home/jym/cpp/gw-server/ai-services/multi_gpu_worker.py --port 50056 --gpu-id 1 --model hdr_fusion --max-batch-size 8 --max-wait-ms 10
directory=/home/jym/cpp/gw-server/ai-services
user=jym
autostart=true
autorestart=true
startsecs=15
startretries=3
exitcodes=0
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/hdr-worker-gpu1-stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/hdr-worker-gpu1-stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=CUDA_VISIBLE_DEVICES="1"

